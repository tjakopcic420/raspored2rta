(function checkForUpdate() {
  try {
    var myVersion = document.querySelector('meta[name="build-version"]').content;
    fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var m = html.match(/name="build-version"\s+content="([^"]+)"/);
        var liveVersion = m && m[1];
        if (liveVersion && liveVersion !== myVersion) {
          // Navigacija na potpuno nov URL (query string) - preglednik ga ne može
          // servirati iz cachea jer je URL doslovno drugačiji, za razliku od reload().
          location.replace(location.pathname + '?_fresh=' + Date.now());
        }
      })
      .catch(function () { /* offline ili greška - tiho nastavi sa starom verzijom */ });
  } catch (e) { /* npr. fetch blokiran - tiho nastavi */ }
})();

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // ponedjeljak = 0
  d.setUTCDate(d.getUTCDate() - dayNum + 3); // četvrtak istog tjedna
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
}

// Pravilo: neparni ISO tjedan -> podnevna smjena, parni ISO tjedan -> jutarnja smjena
const currentISOWeek = getISOWeek(new Date());
let currentShift = (currentISOWeek % 2 === 1) ? "podnevna" : "jutarnja";

function setShift(s) {
  currentShift = s;
  document.getElementById('btn-jutarnja').classList.toggle('active', s==='jutarnja');

  renderTables();
  updateStatus();
}

function timeToMin(t) {
  const [h,m] = t.split(":").map(Number);
  return h*60+m;
}

function renderPeriodInline(p) {
  if (p.split) {
    return p.split.map(g => (g.grupa ? `<b>Gr. ${g.grupa}:</b> ` : "") + `${g.subj} — ${g.room}`).join(" &nbsp;|&nbsp; ");
  }
  return `${p.subj} — ${p.room}`;
}

function buildStatusHTML(p, showTime) {
  if (!p) return null;
  let html = "";
  if (p.split) {
    html += p.split.map(g => `
      <div class="group-line">
        <span>${g.grupa ? '<b>Gr. '+g.grupa+':</b> ' : ''}${g.subj}<br><span style="color:#888;font-size:11px;">${g.teacher}</span></span>
        <span style="font-weight:bold;">${g.room}</span>
      </div>`).join("");
  } else {
    html += `<div class="status-subject">${p.subj}</div>
              <div class="status-detail">${p.teacher} &middot; učionica <b>${p.room}</b></div>`;
  }
  if (showTime) html += `<div class="status-time">${p.start} – ${p.end}</div>`;
  return html;
}

function updateStatus() {
  const now = new Date();
  const clockStr = now.toLocaleTimeString('hr-HR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  document.getElementById('clock').textContent = clockStr + " · " + now.toLocaleDateString('hr-HR', {weekday:'long', day:'numeric', month:'long'}) + ` · ${currentShift === 'podnevna' ? 'neparni' : 'parni'} tjedan (${currentISOWeek}.)`;

  const jsDay = now.getDay(); // 0=Ned,1=Pon,...6=Sub
  const dayMap = {1:"Po",2:"Ut",3:"Sr",4:"Ce",5:"Pe"};
  const todayKey = dayMap[jsDay];
  const nowMin = now.getHours()*60 + now.getMinutes();

  const nowContentEl = document.getElementById('now-content');
  const nextContentEl = document.getElementById('next-content');

  if (!todayKey) {
    nowContentEl.innerHTML = `<div class="none-msg">Vikend — nema nastave 🎉</div>`;
    nextContentEl.innerHTML = `<div class="none-msg">Nastava počinje u ponedjeljak</div>`;
    highlightToday(null, -1);
    return;
  }

  const periods = schedule[currentShift].days[todayKey] || [];
  let current = null, next = null, currentIdx = -1;
  for (let i=0; i<periods.length; i++) {
    const p = periods[i];
    const s = timeToMin(p.start), e = timeToMin(p.end);
    if (nowMin >= s && nowMin < e) { current = p; currentIdx = i; }
    if (nowMin < s && !next) { next = p; }
  }

  nowContentEl.innerHTML = current ? buildStatusHTML(current, true) : `<div class="none-msg">Trenutno nema nastave (pauza)</div>`;
  nextContentEl.innerHTML = next ? buildStatusHTML(next, true) : `<div class="none-msg">${current ? 'Ovo je zadnji sat danas' : 'Nema više nastave danas'}</div>`;

  highlightToday(todayKey, currentIdx);
}

function highlightToday(todayKey, currentIdx) {
  document.querySelectorAll('td.day-cell').forEach(el => el.classList.remove('today-row'));
  document.querySelectorAll('td.current-cell').forEach(el => el.classList.remove('current-cell'));
  if (!todayKey) return;
  const dayCell = document.querySelector(`td.day-cell[data-day="${todayKey}"][data-shift="${currentShift}"]`);
  if (dayCell) dayCell.classList.add('today-row');
  if (currentIdx >= 0) {
    const periodCell = document.querySelector(`td[data-day="${todayKey}"][data-shift="${currentShift}"][data-idx="${currentIdx}"]`);
    if (periodCell) periodCell.classList.add('current-cell');
  }
}

function cellHTML(p) {
  if (!p) return `<td class="empty-cell"></td>`;
  if (p.split) {
    const rows = p.split.map((g,i) => {
      const color = subjColorHex[g.subj] || '#fff';
      const textColor = g.subj === 'Vjeronauk' ? 'color:#fff;' : '';
      return `<tr${i>0?' class="bordered"':''}><td style="background:${color};${textColor}">${g.grupa?'<span class="grupa-label">Gr. '+g.grupa+'</span> ':''}<span class="subj">${g.subj}</span><span class="teacher">${g.teacher}</span><span class="room">${g.room}</span></td></tr>`;
    }).join("");
    return `<td class="split" style="background:${subjColorHex[p.split[p.split.length-1].subj]||'#fff'}"><table class="split-inner-table"><tbody>${rows}</tbody></table></td>`;
  }
  return `<td class="${subjColorClass[p.subj]||''}"><div class="cell-content">
      <span class="subj">${p.subj}</span><span class="teacher">${p.teacher}</span><span class="room">${p.room}</span>
    </div></td>`;
}

  {label:"1.", start:"07:45", end:"08:30"}, {label:"2.", start:"08:35", end:"09:20"}, {label:"3.", start:"09:25", end:"10:10"},
  {label:"4.", start:"10:30", end:"11:15"}, {label:"5.", start:"11:20", end:"12:05"}, {label:"6.", start:"12:10", end:"12:55"},
  {label:"7.", start:"13:00", end:"13:45"}
];
const periodDefsPodnevna = [
  {label:"7.", start:"13:00", end:"13:45"}, {label:"1.", start:"13:50", end:"14:35"}, {label:"2.", start:"14:40", end:"15:25"},
  {label:"3.", start:"15:30", end:"16:15"}, {label:"4.", start:"16:35", end:"17:20"}, {label:"5.", start:"17:25", end:"18:10"},
  {label:"6.", start:"18:15", end:"19:00"}, {label:"7.", start:"19:05", end:"19:50"}
];

function renderTables() {
  const shiftData = schedule[currentShift];
  const periodDefs = currentShift === 'jutarnja' ? periodDefsJutarnja : periodDefsPodnevna;

  let html = `<h2 class="shift-title">${shiftData.label}</h2><table><thead><tr><th></th>`;
  periodDefs.forEach(pd => { html += `<th>${pd.label}<span class="period-time">${pd.start}-${pd.end}</span></th>`; });
  html += `</tr></thead><tbody>`;

  dayOrder.forEach(d => {
    html += `<tr><td class="day-cell" data-day="${d}" data-shift="${currentShift}">${dayDisplay[d]}</td>`;
    const periods = shiftData.days[d];
    let ptr = 0;
    periods.forEach((p, idx) => {
      while (ptr < periodDefs.length && periodDefs[ptr].start !== p.start) {
        html += `<td class="empty-cell"></td>`;
        ptr++;
      }
      const startIdx = ptr;
      let endIdx = startIdx;
      while (endIdx < periodDefs.length && periodDefs[endIdx].end !== p.end) endIdx++;
      const span = endIdx - startIdx + 1;
      let cellStr = cellHTML(p);
      cellStr = cellStr.replace('<td ', `<td data-day="${d}" data-shift="${currentShift}" data-idx="${idx}" ${span>1?`colspan="${span}"`:''} `)
                        .replace('<td>', `<td data-day="${d}" data-shift="${currentShift}" data-idx="${idx}" ${span>1?`colspan="${span}"`:''}>`);
      html += cellStr;
      ptr = endIdx + 1;
    });
    while (ptr < periodDefs.length) { html += `<td class="empty-cell"></td>`; ptr++; }
    html += `</tr>`;
  });
  html += `</tbody></table>
  <div class="legend">
    <div class="legend-item"><span class="swatch c-eng"></span>Engleski jezik</div>
    <div class="legend-item"><span class="swatch c-hrv"></span>Hrvatski jezik</div>
    <div class="legend-item"><span class="swatch c-mat"></span>Matematika</div>
    <div class="legend-item"><span class="swatch c-tzk"></span>Tjelesna i zdravstvena kultura</div>
    <div class="legend-item"><span class="swatch c-tpuk"></span>TPUK</div>
    <div class="legend-item"><span class="swatch c-prog"></span>Programiranje</div>
    <div class="legend-item"><span class="swatch c-urm"></span>Uvod u računalne mreže</div>
    <div class="legend-item"><span class="swatch c-omr"></span>Osnove multimedije</div>
    <div class="legend-item"><span class="swatch c-term"></span>Osnove termodinamike</div>
    <div class="legend-item"><span class="swatch c-sro"></span>Sat razrednog odgoja</div>
    <div class="legend-item"><span class="swatch c-pov"></span>Povijest</div>
    <div class="legend-item"><span class="swatch c-etika"></span>Etika</div>
    <div class="legend-item"><span class="swatch c-vjer"></span>Vjeronauk</div>
  </div>`;

  document.getElementById('tables-container').innerHTML = html;
}



// init
setShift(currentShift);
updateStatus();
setInterval(updateStatus, 15000); // osvježi status svakih 15 sek
setInterval(() => {
  const now = new Date();
  const clockStr = now.toLocaleTimeString('hr-HR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  document.getElementById('clock').textContent = clockStr + " · " + now.toLocaleDateString('hr-HR', {weekday:'long', day:'numeric', month:'long'}) + ` · ${currentShift === 'podnevna' ? 'neparni' : 'parni'} tjedan (${currentISOWeek}.)`;
}, 1000);
</script>
